services:
  postgres:
    image: postgres:16-alpine
    container_name: applymate-db
    environment:
      POSTGRES_DB: applymate
      POSTGRES_USER: applymate
      POSTGRES_PASSWORD: applymate
    ports:
      - "5432:5432"
    volumes:
      - applymate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applymate -d applymate"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: applymate-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/applymate
      SPRING_DATASOURCE_USERNAME: applymate
      SPRING_DATASOURCE_PASSWORD: applymate
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-256-bits}
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Optional: without these, AI features are off and the feed is remote-only.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      JOB_COUNTRY: ${JOB_COUNTRY:-ca}
      # Optional email. Without it, reset links are printed to this container's log.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ApplyMate <no-reply@applymate.local>}
      LOG_RESET_LINKS: ${LOG_RESET_LINKS:-true}
    ports:
      - "8000:8080"
      # 9091 (health and Prometheus metrics) is deliberately not published.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: applymate-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  applymate_pgdata:
