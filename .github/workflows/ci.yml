name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Integration tests start Postgres with Testcontainers; the runner has Docker.
      - run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # The whole stack, as a user sees it: Postgres, the Spring Boot jar, the built frontend, a real browser.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: applymate
          POSTGRES_USER: applymate
          POSTGRES_PASSWORD: applymate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U applymate" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/applymate
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend
        working-directory: backend
        run: |
          ./gradlew bootJar --no-daemon -q
          nohup java -jar build/libs/*.jar > backend.log 2>&1 &
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=http://localhost:8080/api npm run build
          nohup npx next start -p 3000 > frontend.log 2>&1 &
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9091/actuator/health/readiness && curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          cat backend/backend.log; exit 1
      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/backend.log
