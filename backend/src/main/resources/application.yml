spring:
  application:
    name: applymate-backend
  # Optional local overrides — create backend/application-local.yml (gitignored), no exports needed
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/applymate}
    username: ${SPRING_DATASOURCE_USERNAME:applymate}
    password: ${SPRING_DATASOURCE_PASSWORD:applymate}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-in-production-min-256-bits-required-for-hs512}
  # 15-minute access tokens, renewed with a rotating 30-day refresh token.
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  ai:
    api-key: ${GEMINI_API_KEY:}
    models: ${GEMINI_MODELS:gemini-flash-latest,gemini-flash-lite-latest}
    daily-limit-per-user: ${AI_DAILY_LIMIT_PER_USER:25}
    per-minute-limit-per-user: ${AI_PER_MINUTE_LIMIT_PER_USER:6}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  jobs:
    adzuna-app-id: ${ADZUNA_APP_ID:}
    adzuna-app-key: ${ADZUNA_APP_KEY:}
    country: ${JOB_COUNTRY:ca}
    feed-cache-minutes: ${FEED_CACHE_MINUTES:180}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${SMTP_FROM:ApplyMate <no-reply@applymate.local>}
    # Local development only: print reset links to the log when email is off.
    log-links-when-disabled: ${LOG_RESET_LINKS:false}
  auth:
    register-per-hour-per-ip: ${REGISTER_PER_HOUR_PER_IP:10}
    login-per-15-minutes-per-ip: ${LOGIN_PER_15_MINUTES_PER_IP:50}

# Health and metrics on their own port, which is never published publicly.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: applymate
    distribution:
      percentiles-histogram:
        applymate.ai.request: true
        http.server.requests: true

logging:
  level:
    com.applymate: INFO
  pattern:
    # Every line carries the request id set by RequestIdFilter.
    level: "%5p [%X{requestId:-}]"
