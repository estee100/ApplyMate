spring:
  application:
    name: applymate-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/applymate}
    username: ${SPRING_DATASOURCE_USERNAME:applymate}
    password: ${SPRING_DATASOURCE_PASSWORD:applymate}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-in-production-min-256-bits-required-for-hs512}
  expiration-ms: 86400000

logging:
  level:
    com.applymate: INFO
